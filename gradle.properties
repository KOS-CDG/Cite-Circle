# Project-wide Gradle settings.

# Enable AndroidX support
android.useAndroidX=true

# Non-transitive R class for faster build times
android.nonTransitiveRClass=true

# Set official Kotlin code style
kotlin.code.style=official

# Suppress compileSdk warning for Android 36
android.suppressUnsupportedCompileSdk=36

# JVM arguments for the daemon - increase to 4GB heap size for faster compilation on local hardware
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m

# Enable parallel build execution
org.gradle.parallel=true

# Enable build caching to reuse unchanged task outputs
org.gradle.caching=true

# Enable configuration caching to bypass configuration phase for subsequent builds
org.gradle.configuration-cache=true

# Enable incremental compilation for Kotlin
kotlin.incremental=true

